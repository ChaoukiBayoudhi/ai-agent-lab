# CI for the AI Agent Lab: install and run the pytest suite (mcp_engine/tests).
name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13" ]   # Django 6.x requires Python >= 3.12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check . || true   # remove "|| true" once the codebase is clean

      - name: Run tests (pytest)
        # No GROQ_API_KEY in CI: the orchestrator degrades gracefully and the
        # suite does not call the live API.
        run: python -m pytest
