<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Agent Lab{% endblock %}</title>

  <!-- Minimal CSS — no CDN dependencies, fully offline-capable -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:   #1A3683;
      --teal:   #3AACAE;
      --gold:   #E8A020;
      --green:  #27AE60;
      --red:    #C0392B;
      --light:  #F3F4F6;
      --dark:   #111827;
      --border: #D1D5DB;
      --radius: 8px;
      --font:   system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: var(--navy);
      color: #fff;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
    }
    nav .brand {
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: .5px;
      color: var(--teal);
      text-decoration: none;
    }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: .9rem;
      transition: color .15s;
    }
    nav a:hover, nav a.active { color: #fff; }
    nav .spacer { flex: 1; }
    nav .badge {
      background: var(--teal);
      color: #fff;
      font-size: .7rem;
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* ── Layout ── */
    main { flex: 1; padding: 2rem 1.5rem; max-width: 1200px; margin: 0 auto; width: 100%; }

    h1 { font-size: 1.8rem; color: var(--navy); margin-bottom: .5rem; }
    h2 { font-size: 1.3rem; color: var(--navy); margin: 1.5rem 0 .75rem; }
    h3 { font-size: 1.05rem; margin: 1rem 0 .5rem; }
    p  { line-height: 1.7; color: #374151; }

    /* ── Cards ── */
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .card-icon { font-size: 2rem; margin-bottom: .5rem; }

    /* ── Forms ── */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: .875rem; font-weight: 600; margin-bottom: .35rem; color: #374151; }
    input[type=text], input[type=number], textarea, select {
      width: 100%; padding: .55rem .8rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      font-family: var(--font); font-size: .95rem;
      transition: border-color .15s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(58,172,174,.15);
    }
    textarea { resize: vertical; min-height: 80px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .55rem 1.2rem; border: none; border-radius: var(--radius);
      font-size: .9rem; font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    .btn:hover { opacity: .88; }
    .btn-primary   { background: var(--navy);  color: #fff; }
    .btn-secondary { background: var(--teal);  color: #fff; }
    .btn-gold      { background: var(--gold);  color: #fff; }
    .btn-danger    { background: var(--red);   color: #fff; }
    .btn-sm        { padding: .3rem .8rem; font-size: .8rem; }

    /* ── Result / Response boxes ── */
    .result-box {
      background: #f8fafc; border: 1px solid var(--teal);
      border-left: 4px solid var(--teal);
      border-radius: var(--radius); padding: 1rem 1.25rem;
      margin-top: 1rem; white-space: pre-wrap; font-family: monospace;
      font-size: .85rem; max-height: 400px; overflow-y: auto;
    }
    .result-box.error { border-color: var(--red); }
    .result-box.success { border-color: var(--green); }

    /* ── Badges ── */
    .tag {
      display: inline-block; background: var(--teal); color: #fff;
      font-size: .7rem; padding: 2px 8px; border-radius: 999px; margin: 2px;
    }
    .tag.gold { background: var(--gold); }
    .tag.navy { background: var(--navy); }
    .tag.green { background: var(--green); }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { background: var(--navy); color: #fff; padding: .6rem .8rem; text-align: left; }
    td { padding: .55rem .8rem; border-bottom: 1px solid var(--border); }
    tr:hover td { background: #f1f5f9; }

    /* ── Info boxes ── */
    .info-box {
      background: #eff6ff; border-left: 4px solid var(--teal);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: .75rem 1rem; margin: 1rem 0; font-size: .875rem;
    }
    .warn-box {
      background: #fffbeb; border-left: 4px solid var(--gold);
      border-radius: 0 var(--radius) var(--radius) 0;
      padding: .75rem 1rem; margin: 1rem 0; font-size: .875rem;
    }

    /* ── Loading spinner ── */
    .spinner {
      display: none; width: 20px; height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--teal);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Chat bubbles ── */
    .chat-wrap { max-height: 400px; overflow-y: auto; padding: .5rem 0; }
    .bubble {
      max-width: 78%; margin: .4rem 0; padding: .6rem 1rem;
      border-radius: 12px; font-size: .9rem; line-height: 1.5;
    }
    .bubble.user   { background: var(--navy); color: #fff; margin-left: auto; border-bottom-right-radius: 2px; }
    .bubble.agent  { background: #fff; border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .bubble .meta  { font-size: .7rem; opacity: .7; margin-top: .25rem; }

    /* ── Footer ── */
    footer {
      text-align: center; padding: 1rem;
      font-size: .8rem; color: #9CA3AF;
      border-top: 1px solid var(--border);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

<nav>
  <a class="brand" href="{% url 'mcp_engine:index' %}">🤖 AI Agent Lab</a>
  <a href="{% url 'mcp_engine:calculator' %}" {% if request.resolver_match.url_name == 'calculator' %}class="active"{% endif %}>🧮 Calculator</a>
  <a href="{% url 'mcp_engine:agent' %}"      {% if request.resolver_match.url_name == 'agent' %}class="active"{% endif %}>💬 Agent Chat</a>
  <a href="{% url 'mcp_engine:a2a' %}"         {% if request.resolver_match.url_name == 'a2a' %}class="active"{% endif %}>🔁 A2A Demo</a>
  <a href="{% url 'mcp_engine:notes' %}"       {% if request.resolver_match.url_name == 'notes' %}class="active"{% endif %}>📝 Notes</a>
  <a href="{% url 'mcp_engine:history' %}"     {% if request.resolver_match.url_name == 'history' %}class="active"{% endif %}>📋 History</a>
  <span class="spacer"></span>
  <span class="badge">MCP + A2A + Groq</span>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  AI Agent Lab — MCP · A2A · Groq · Django · Sesame University 2025-2026
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
