[pytest]
# ── Django settings ────────────────────────────────────────────────────────
DJANGO_SETTINGS_MODULE = ai_agent_lab.settings

# ── pytest-asyncio ─────────────────────────────────────────────────────────
asyncio_mode = auto

# ── Test discovery ─────────────────────────────────────────────────────────
testpaths = mcp_engine/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ─────────────────────────────────────────────────────────────────
addopts =
    --tb=short
    -q

# ── Markers ────────────────────────────────────────────────────────────────
markers =
    asyncio: marks tests as async
    django_db: marks tests that require database access
    slow: marks tests that are slow (e.g. actual Groq API calls)
